<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 강의분석 리포트 생성기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Noto Sans KR', '맑은 고딕', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif;
  }
  .card {
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 24px;
    padding: 48px 40px;
    width: 380px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.4);
  }
  .logo {
    text-align: center;
    margin-bottom: 32px;
  }
  .logo-icon {
    width: 56px; height: 56px;
    background: linear-gradient(135deg, #6c63ff, #3ec6e0);
    border-radius: 16px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 28px; margin-bottom: 12px;
  }
  h1 { color: #fff; font-size: 20px; font-weight: 700; }
  p.sub { color: rgba(255,255,255,0.5); font-size: 13px; margin-top: 4px; }
  .field { margin-bottom: 16px; }
  label { display: block; color: rgba(255,255,255,0.7); font-size: 13px; margin-bottom: 6px; }
  input {
    width: 100%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    padding: 12px 16px;
    color: #fff; font-size: 15px;
    outline: none; transition: border .2s;
  }
  input:focus { border-color: #6c63ff; }
  .btn {
    width: 100%; padding: 13px;
    background: linear-gradient(135deg, #6c63ff, #3ec6e0);
    border: none; border-radius: 10px;
    color: #fff; font-size: 15px; font-weight: 700;
    cursor: pointer; margin-top: 8px; transition: opacity .2s;
  }
  .btn:hover { opacity: 0.88; }
  .error {
    background: rgba(255,80,80,0.15);
    border: 1px solid rgba(255,80,80,0.3);
    border-radius: 8px; padding: 10px 14px;
    color: #ff8080; font-size: 13px; margin-bottom: 16px;
    display: none;
  }
  .error.show { display: block; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">🎓</div>
    <h1>AI 강의분석 리포트</h1>
    <p class="sub">Lecture Analysis Dashboard</p>
  </div>
  <div class="error <?= isset($_GET['error']) ? 'show' : '' ?>" id="errMsg">
    아이디 또는 비밀번호가 올바르지 않습니다.
  </div>
  <form method="POST" action="/login">
    <div class="field">
      <label>아이디</label>
      <input type="text" name="username" placeholder="admin" autocomplete="username" required>
    </div>
    <div class="field">
      <label>비밀번호</label>
      <input type="password" name="password" placeholder="••••••" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn">로그인</button>
  </form>
</div>
<script>
  if (location.search.includes('error=1')) {
    document.getElementById('errMsg').classList.add('show');
  }
</script>
</body>
</html>
