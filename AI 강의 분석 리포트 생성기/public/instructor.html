<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강사 상세 — AI 강의분석</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#0d1117;--surf:#161b22;--surf2:#21262d;--border:rgba(255,255,255,0.08);--accent:#58a6ff;--green:#3fb950;--yellow:#d29922;--red:#f85149;--text:#e6edf3;--muted:rgba(230,237,243,0.5)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR','Malgun Gothic',sans-serif;min-height:100vh;overflow-x:hidden}
header{display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:56px;background:var(--surf);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200}
.brand{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700}
.brand-icon{width:34px;height:34px;background:linear-gradient(135deg,#58a6ff,#3fb950);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px}
.back{color:var(--muted);font-size:13px;text-decoration:none;transition:color .2s}
.back:hover{color:var(--accent)}
main{padding:32px 28px;max-width:1100px;margin:0 auto}
.hero{display:flex;align-items:center;gap:20px;margin-bottom:28px;flex-wrap:wrap}
.avatar-lg{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;flex-shrink:0;border:2px solid rgba(88,166,255,.4);background:rgba(88,166,255,.12);color:#58a6ff}
.hero-info{flex:1}
.hero-name{font-size:24px;font-weight:700;margin-bottom:4px}
.hero-sub{font-size:13px;color:var(--muted);margin-bottom:8px}
.grade-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:20px;font-size:13px;font-weight:700}
.headline{background:var(--surf);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:14px 18px;margin-bottom:24px;font-size:14px;line-height:1.7;color:var(--text)}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:24px}
.stat-card{background:var(--surf);border:0.5px solid var(--border);border-radius:12px;padding:14px 16px;text-align:center}
.stat-val{font-size:22px;font-weight:700;margin-bottom:2px}
.stat-lbl{font-size:11px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--surf);border:0.5px solid var(--border);border-radius:14px;padding:20px}
.panel-title{font-size:14px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:6px}
.cat-bar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cat-name{font-size:12px;color:var(--muted);min-width:70px}
.cat-bar-bg{flex:1;height:6px;background:var(--surf2);border-radius:3px;overflow:hidden}
.cat-bar-fill{height:100%;border-radius:3px;transition:width .4s}
.cat-score{font-size:12px;font-weight:600;min-width:36px;text-align:right}
.tag-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:6px;font-size:11px;background:rgba(248,81,73,.1);color:#f85149;border:1px solid rgba(248,81,73,.2);margin:3px}
.text-block{font-size:13px;line-height:1.75;color:var(--text)}
.bullet{display:flex;gap:8px;margin-bottom:8px;font-size:13px;line-height:1.6}
.bullet::before{content:"•";color:var(--accent);flex-shrink:0}
.section-title{font-size:16px;font-weight:700;margin:28px 0 14px;display:flex;align-items:center;gap:8px}
.history-item{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surf2);border:0.5px solid var(--border);border-radius:10px;padding:14px 18px;margin-bottom:8px;transition:border-color .2s;flex-wrap:wrap}
.history-item:hover{border-color:var(--accent)}
.date-badge{background:rgba(88,166,255,.1);border:1px solid rgba(88,166,255,.2);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;color:#58a6ff;white-space:nowrap}
.score-badge{font-size:11px;padding:3px 8px;border-radius:6px;font-weight:500}
.btn-detail{background:rgba(88,166,255,.1);border:1px solid rgba(88,166,255,.3);border-radius:8px;padding:7px 16px;color:#58a6ff;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;transition:all .2s}
.btn-detail:hover{background:rgba(88,166,255,.2)}
.btn-refresh{background:var(--surf2);border:0.5px solid var(--border);border-radius:8px;padding:7px 14px;color:var(--muted);font-size:12px;cursor:pointer;transition:all .2s}
.btn-refresh:hover{color:var(--text);border-color:var(--accent)}
.loading{text-align:center;padding:60px;color:var(--muted)}
.warn-box{background:rgba(210,153,34,.08);border:1px solid rgba(210,153,34,.2);border-radius:10px;padding:12px 16px;font-size:12px;color:var(--yellow);margin-bottom:16px}

.progress-wrap{background:var(--surf2);border-radius:14px;padding:20px 24px;margin-bottom:16px;display:none}
.progress-label{font-size:13px;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.progress-bar-bg{height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.progress-bar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#58a6ff,#3fb950);transition:width .4s ease;width:0%}
.progress-steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.step-dot{font-size:11px;padding:3px 10px;border-radius:12px;background:var(--surf);border:0.5px solid var(--border);color:var(--muted);transition:all .3s}
.step-dot.active{background:rgba(88,166,255,.15);border-color:rgba(88,166,255,.4);color:#58a6ff}
.step-dot.done{background:rgba(63,185,80,.1);border-color:rgba(63,185,80,.3);color:#3fb950}

@media print {
  header, .btn-refresh, .btn-detail, .section-title + div button, #summaryPlaceholder,
  #summarySection > div:first-child, #exportBtns,
  #app > div[style*="display:flex"][style*="gap:8px"][style*="margin-bottom:16px"] { display:none!important }
  body { background:#fff!important; color:#111!important }
  .panel { background:#f9f9f9!important; border:1px solid #ddd!important; break-inside:avoid }
  .grid2 { display:grid!important; grid-template-columns:1fr 1fr; gap:12px }
  .stat-card { background:#f0f0f0!important; border:1px solid #ccc!important }
  .stat-lbl { color:#444!important }
  .stat-val { color:#111!important }
  .cat-name, .cat-score { color:#111!important }
  /* 1번: 상단 흐릿한 글씨 (날짜, 강의 수) */
  .hero-sub { color:#333!important }
  .hero-name { color:#111!important }
  .avatar-lg { border-color:#58a6ff!important; color:#1a5cb0!important }
  .grade-badge { color:#111!important }
  /* 3번: 차트 레이블 흐릿한 글씨 */
  canvas { filter: invert(0) !important }
  .text-block, .bullet { color:#222!important }
  .tag-chip { color:#555!important; border-color:#999!important }
  .panel-title { color:#111!important }
  .history-item { break-inside:avoid; border:1px solid #ddd!important; background:#f9f9f9!important }
  .date-badge { color:#1a5cb0!important; border-color:#1a5cb0!important }
  .score-badge { color:#333!important }
  .warn-box { color:#7a5a00!important }
  .headline { color:#111!important; border-left-color:#1a5cb0!important; background:#f0f4ff!important }
  * { print-color-adjust:exact; -webkit-print-color-adjust:exact }
}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="brand-icon">🎓</div>AI 강의분석 리포트</div>
  <a href="/instructors" class="back">← 강사 목록</a>
</header>
<main>
  <div id="loading" class="loading">⏳ 강사 종합평가 로딩 중...</div>
  <div id="app" style="display:none">
    <!-- 강사 헤더 -->
    <div class="hero">
      <div class="avatar-lg" id="heroAvatar"></div>
      <div class="hero-info">
        <div class="hero-name" id="heroName"></div>
        <div class="hero-sub" id="heroSub"></div>
        <span id="gradeDisplay" style="display:none"></span>
      </div>
      <button id="summaryToggleBtn" class="btn-detail"
        onclick="loadSummary(true)"
        style="flex-shrink:0;display:none">
        ✨ 종합평가 생성
      </button>
    </div>

    <!-- 종합평가 플레이스홀더 (버튼 클릭 전) -->
    <div id="summaryPlaceholder" style="background:var(--surf);border:0.5px dashed var(--border);border-radius:14px;padding:32px;text-align:center;margin-bottom:24px">
      <div style="font-size:24px;margin-bottom:8px">📊</div>
      <div style="font-size:14px;font-weight:600;margin-bottom:6px">강사 종합평가</div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:16px">AI가 전체 강의 데이터를 분석하여 역량 프로파일, 강약점, 개발 과제를 생성합니다.</div>
      <button id="genSummaryBtn" onclick="loadSummary(true)"
        style="background:rgba(88,166,255,.1);border:1px solid rgba(88,166,255,.3);border-radius:8px;padding:8px 20px;color:#58a6ff;font-size:13px;font-weight:600;cursor:pointer">
        ✨ 종합평가 생성하기
      </button>

      <!-- 진행 게이지 (생성 중에만 표시) -->
      <div class="progress-wrap" id="summaryProgress">
        <div class="progress-label">
          <span id="progressSpinner" style="display:inline-block;animation:spin 1s linear infinite">⚙️</span>
          <span id="progressLabel">AI 분석 중...</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressBar"></div>
        </div>
        <div class="progress-steps" id="progressSteps">
          <span class="step-dot" id="step1">📊 데이터 로드</span>
          <span class="step-dot" id="step2">🧮 점수 계산</span>
          <span class="step-dot" id="step3">🤖 AI 분석</span>
          <span class="step-dot" id="step4">💾 저장</span>
        </div>
        <div style="margin-top:12px;text-align:center">
          <button id="cancelSummaryBtn" onclick="cancelSummary()"
            style="background:rgba(248,81,73,.08);border:1px solid rgba(248,81,73,.25);border-radius:8px;padding:6px 18px;color:#f85149;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s"
            onmouseover="this.style.background='rgba(248,81,73,.2)'" onmouseout="this.style.background='rgba(248,81,73,.08)'">
            ✕ 취소
          </button>
        </div>
      </div>
    </div>

    <style>
    @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    </style>

    <!-- 종합평가 결과 (생성 후 표시) -->
    <div id="summarySection" style="display:none">
      <!-- 재생성 버튼 -->
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:12px">
        <button onclick="exportPDF()" style="background:rgba(248,81,73,.08);border:1px solid rgba(248,81,73,.25);border-radius:8px;padding:6px 14px;color:#f85149;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s" onmouseover="this.style.background='rgba(248,81,73,.18)'" onmouseout="this.style.background='rgba(248,81,73,.08)'">📄 PDF</button>
        <button id="docxBtn" onclick="exportDOCX()" style="background:rgba(88,166,255,.08);border:1px solid rgba(88,166,255,.25);border-radius:8px;padding:6px 14px;color:#58a6ff;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s" onmouseover="this.style.background='rgba(88,166,255,.18)'" onmouseout="this.style.background='rgba(88,166,255,.08)'">📝 DOCX</button>
        <button onclick="regenSummary()"
          style="background:var(--surf2);border:0.5px solid var(--border);border-radius:8px;padding:6px 14px;color:var(--muted);font-size:12px;cursor:pointer;transition:all .2s"
          onmouseover="this.style.color='var(--text)';this.style.borderColor='var(--accent)'"
          onmouseout="this.style.color='var(--muted)';this.style.borderColor='var(--border)'">
          🔄 재생성
        </button>
      </div>
      <!-- 통계 카드 -->
      <div class="stats-row" id="statsRow"></div>
      <!-- 차트 -->
      <div class="grid2">
        <div class="panel">
          <div class="panel-title">📊 카테고리별 평균</div>
          <div id="catBars"></div>
          <div id="trendInfo"></div>
        </div>
        <div class="panel">
          <div class="panel-title">📡 역량 레이더</div>
          <div style="position:relative;height:240px;width:100%">
            <canvas id="radarChart"></canvas>
          </div>
        </div>
      </div>
      <!-- 역량 프로파일 -->
      <div class="grid2">
        <div class="panel">
          <div class="panel-title">💬 역량 프로파일</div>
          <div class="text-block" id="profileSummary"></div>
        </div>
        <div class="panel">
          <div class="panel-title">✅ 체계적 강점</div>
          <div id="strengthsList"></div>
        </div>
      </div>
      <!-- 약점 + 개발과제 -->
      <div class="grid2">
        <div class="panel">
          <div class="panel-title">⚠️ 체계적 약점</div>
          <div id="weaknessesList"></div>
          <div id="rwTags" style="margin-top:10px"></div>
        </div>
        <div class="panel">
          <div class="panel-title">🎯 개발 과제</div>
          <div id="goalsList"></div>
        </div>
      </div>
      <!-- 추세/일관성 -->
      <div class="grid2">
        <div class="panel">
          <div class="panel-title">📈 추세 분석</div>
          <div class="text-block" id="trajectoryNote"></div>
        </div>
        <div class="panel">
          <div class="panel-title">🔍 일관성</div>
          <div class="text-block" id="consistencyNote"></div>
        </div>
      </div>
      <div id="validityCaveats"></div>
    </div>

    <!-- 강의 이력 -->
    <div class="section-title" style="justify-content:space-between;flex-wrap:wrap;gap:8px">
      <span>📋 강의 이력</span>
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:12px;color:var(--muted)" id="lectureCountLabel"></span>
        <select id="lecturePageSize" onchange="renderLectures()"
          style="background:var(--surf2);border:0.5px solid var(--border);border-radius:8px;padding:5px 10px;color:var(--text);font-size:12px;outline:none">
          <option value="5">5개씩</option>
          <option value="10" selected>10개씩</option>
          <option value="20">20개씩</option>
          <option value="0">전체</option>
        </select>
        <button id="lecturePrevBtn" onclick="changeLecturePage(-1)"
          style="background:var(--surf2);border:0.5px solid var(--border);border-radius:8px;padding:5px 10px;color:var(--muted);font-size:12px;cursor:pointer">◀</button>
        <span id="lecturePageLabel" style="font-size:12px;color:var(--muted)"></span>
        <button id="lectureNextBtn" onclick="changeLecturePage(1)"
          style="background:var(--surf2);border:0.5px solid var(--border);border-radius:8px;padding:5px 10px;color:var(--muted);font-size:12px;cursor:pointer">▶</button>
      </div>
    </div>
    <div id="lectureList"><div class="loading" style="padding:20px">이력 로딩 중...</div></div>
  </div>
</main>

<script>
const CATE_META = {
  '1':{label:'언어 표현',  color:'#58a6ff'},
  '2':{label:'도입·구조',  color:'#3fb950'},
  '3':{label:'개념 명확',  color:'#d29922'},
  '4':{label:'예시·실습',  color:'#bc8cff'},
  '5':{label:'상호작용',   color:'#ff7a5c'},
};
const GRADE_COLOR = {'탁월':'#3fb950','우수':'#58a6ff','평범':'#d29922','미흡':'#f85149'};
const params   = new URLSearchParams(location.search);
const instrName = params.get('name') || '';
let _lectures  = [];
let radarChart = null;

function hexAlpha(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return `rgba(${r},${g},${b},${a})`;}
function scoreColor(s){if(s>=80)return '#3fb950';if(s>=65)return '#58a6ff';if(s>=50)return '#d29922';return '#f85149';}

// ── 기본 정보만 표시 (강의 이력 로드 전) ─────────────────────
async function loadBasicInfo(){
  document.getElementById('loading').style.display='none';
  document.getElementById('app').style.display='block';

  // 강사 헤더만 표시
  const color = '#58a6ff';
  const hexA = (hex,a)=>{const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return `rgba(${r},${g},${b},${a})`;};
  document.getElementById('heroAvatar').textContent = instrName[0]||'?';
  document.getElementById('heroAvatar').style.cssText = `width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;background:${hexA(color,.15)};border:2px solid ${hexA(color,.4)};color:${color}`;
  document.getElementById('heroName').textContent = instrName + ' 강사';
  document.getElementById('heroSub').textContent  = '강의 이력 로딩 중...';
}

// ── 강사 종합평가 로드 ────────────────────────────────────────
function regenSummary(){
  document.getElementById('summarySection').style.display='none';
  document.getElementById('summaryPlaceholder').style.display='block';
  document.getElementById('genSummaryBtn').style.display='block';
  loadSummary(true);
}

function startProgress(){
  const prog    = document.getElementById('summaryProgress');
  const bar     = document.getElementById('progressBar');
  const label   = document.getElementById('progressLabel');
  const genBtn  = document.getElementById('genSummaryBtn');
  const steps   = ['step1','step2','step3','step4'];
  const labels  = ['📊 강의 데이터 로드 중...','🧮 카테고리 점수 계산 중...','🤖 AI가 역량을 분석 중...','💾 결과 저장 중...'];
  const durations = [5, 15, 60, 5]; // 각 단계 예상 초
  const total   = durations.reduce((a,b)=>a+b, 0);

  prog.style.display = 'block';
  if(genBtn) genBtn.style.display = 'none';

  let elapsed = 0, currentStep = 0;
  steps.forEach(id => document.getElementById(id).className = 'step-dot');
  document.getElementById(steps[0]).className = 'step-dot active';
  label.textContent = labels[0];

  const timer = setInterval(()=>{
    elapsed++;
    const pct = Math.min(95, Math.round(elapsed/total*100));
    bar.style.width = pct + '%';

    // 단계 업데이트
    let acc = 0;
    for(let i=0; i<durations.length; i++){
      acc += durations[i];
      if(elapsed <= acc && currentStep <= i){
        if(currentStep < i){
          for(let j=0; j<i; j++) document.getElementById(steps[j]).className='step-dot done';
          document.getElementById(steps[i]).className='step-dot active';
          label.textContent = labels[i];
          currentStep = i;
        }
        break;
      }
    }
  }, 1000);

  return () => {
    clearInterval(timer);
    bar.style.width = '100%';
    steps.forEach(id => document.getElementById(id).className='step-dot done');
    label.textContent = '✅ 완료!';
    setTimeout(()=>{ prog.style.display='none'; }, 800);
  };
}

let _summaryAbortCtrl = null;

async function cancelSummary(){
  if(_summaryAbortCtrl) _summaryAbortCtrl.abort();
  // 서버 프로세스도 취소 요청
  await fetch(`/api/instructor/${encodeURIComponent(instrName)}/summary/cancel`, { method:'POST' }).catch(()=>{});
  const prog  = document.getElementById('summaryProgress');
  const genBtn = document.getElementById('genSummaryBtn');
  if(prog) prog.style.display = 'none';
  if(genBtn) genBtn.style.display = 'inline-block';
}

async function loadSummary(refresh=false){
  const genBtn = document.getElementById('genSummaryBtn');
  _summaryAbortCtrl = new AbortController();
  const stopProgress = startProgress();
  try{
    const url = `/api/instructor/${encodeURIComponent(instrName)}/summary` + (refresh?'?refresh=1':'');
    const res  = await fetch(url, { signal: _summaryAbortCtrl.signal });
    const data = await res.json();
    stopProgress();
    if(data.error) throw new Error(data.error);
    document.getElementById('summarySection').style.display='block';
    document.getElementById('summaryPlaceholder').style.display='none';
    requestAnimationFrame(()=>renderSummary(data));
  }catch(e){
    stopProgress();
    if(e.name === 'AbortError') return; // 취소 시 오류 표시 안 함
    if(genBtn) genBtn.style.display='inline-block';
    alert('오류: ' + e.message);
  } finally {
    _summaryAbortCtrl = null;
  }
}

// ── 강의 목록 로드 ────────────────────────────────────────────
async function loadLectures(){
  try{
    const res  = await fetch(`/api/instructor/${encodeURIComponent(instrName)}/lectures`);
    _lectures  = await res.json();
    // heroSub 업데이트
    const sub = document.getElementById('heroSub');
    if(sub && !sub.textContent.includes('~')){
      sub.textContent = `총 ${_lectures.length}회 강의 분석`;
    }
    renderLectures();
  }catch(e){ console.error(e); }
}

// ── 종합평가 렌더링 (기존 HTML 구조에 데이터 채우기) ──────────
function renderSummary(d){
  const gColor  = GRADE_COLOR[d.proficiency_grade]||'#58a6ff';
  const overall = d.stats?.overall||{};
  const cats    = d.stats?.categories||{};
  const rw      = d.stats?.recurring_weaknesses||[];
  const trend   = d.stats?.trend;
  const cached  = d._cached ? ' (캐시됨)' : '';

  // 헤더 업데이트
  document.getElementById('heroName').textContent = instrName + ' 강사';
  document.getElementById('heroSub').textContent  =
    `${d.date_range?.[0]||''} ~ ${d.date_range?.[1]||''} · ${d.n_lectures||0}회 강의`;
  const grade = document.getElementById('gradeDisplay');
  grade.style.display = 'inline-flex';
  grade.className = 'grade-badge';
  grade.style.cssText = `display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:20px;font-size:13px;font-weight:700;background:${hexAlpha(gColor,.15)};color:${gColor};border:1px solid ${hexAlpha(gColor,.3)}`;
  grade.textContent = d.proficiency_grade||'-';

  // 통계 카드
  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card"><div class="stat-val" style="color:${scoreColor(overall.mean||0)}">${overall.mean||'-'}</div><div class="stat-lbl">종합 평균 (100점)</div></div>
    <div class="stat-card"><div class="stat-val" style="color:var(--muted)">${overall.sd!=null?overall.sd:'-'}</div><div class="stat-lbl">표준편차</div></div>
    <div class="stat-card"><div class="stat-val" style="color:#3fb950">${overall.max||'-'}</div><div class="stat-lbl">최고 점수</div></div>
    <div class="stat-card"><div class="stat-val" style="color:#f85149">${overall.min||'-'}</div><div class="stat-lbl">최저 점수</div></div>`;

  // 카테고리 바
  document.getElementById('catBars').innerHTML = Object.entries(cats).map(([k,v])=>{
    if(!v||v.mean==null) return '';
    const pct = Math.min(100,v.mean), col=(CATE_META[k]||{}).color||'#58a6ff';
    const name=(CATE_META[k]||{}).label||(v.name||k);
    return `<div class="cat-bar"><span class="cat-name">${name}</span>
      <div class="cat-bar-bg"><div class="cat-bar-fill" style="width:${pct}%;background:${col}"></div></div>
      <span class="cat-score" style="color:${col}">${v.mean}</span></div>`;
  }).join('') || '<span style="color:var(--muted);font-size:13px">데이터 없음</span>';

  // 추세
  if(trend){
    const d2=trend.half_delta, col=d2>0?'#3fb950':d2<0?'#f85149':'#58a6ff';
    document.getElementById('trendInfo').innerHTML=`<div style="display:flex;gap:16px;flex-wrap:wrap;font-size:12px;margin-top:8px"><span>전반 <b>${trend.first_half_mean}</b></span><span>→</span><span>후반 <b>${trend.second_half_mean}</b></span><span style="color:${col}">(${d2>0?'+':''}${d2}점)</span></div>`;
  }

  // 레이더
  const catKeys=Object.keys(CATE_META), radarData=catKeys.map(k=>cats[k]?.mean??0);
  const ctx=document.getElementById('radarChart');
  if(ctx){ if(radarChart)radarChart.destroy();
    radarChart=new Chart(ctx,{type:'radar',data:{labels:catKeys.map(k=>CATE_META[k].label),datasets:[{label:'평균',data:radarData,backgroundColor:'rgba(88,166,255,0.15)',borderColor:'#58a6ff',pointBackgroundColor:catKeys.map(k=>CATE_META[k].color),borderWidth:2,pointRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{r:{min:0,max:100,ticks:{display:false},grid:{color:'rgba(255,255,255,.07)'},angleLines:{color:'rgba(255,255,255,.07)'},pointLabels:{color:'#e6edf3',font:{size:10}}}}}});
  }

  // 텍스트 필드
  document.getElementById('profileSummary').textContent = d.profile_summary||d.headline||'-';
  document.getElementById('trajectoryNote').textContent = d.trajectory_note||'-';
  document.getElementById('consistencyNote').textContent = d.consistency_note||'-';

  // 강점/약점/목표
  const mkBullets = arr=>(arr||[]).map(s=>`<div class="bullet">${s}</div>`).join('') || '<span style="color:var(--muted);font-size:13px">-</span>';
  document.getElementById('strengthsList').innerHTML  = mkBullets(d.systematic_strengths);
  const cleanWeaknesses = (d.systematic_weaknesses||[]).map(w => w.replace(/\(\d+(\.\d+)?%\)/g, '').replace(/\d+(\.\d+)?%/g, '').trim());
  document.getElementById('weaknessesList').innerHTML = mkBullets(cleanWeaknesses);
  const cleanGoals = (d.development_goals||[]).map(g => g.replace(/\(\d+(\.\d+)?%\)/g, '').replace(/\d+(\.\d+)?%/g, '').replace(/\s*\([^)]*\)\s*$/g, '').trim());
  document.getElementById('goalsList').innerHTML      = cleanGoals.map((g,i)=>`<div class="bullet"><strong>${i+1}.</strong> ${g}</div>`).join('') || '<span style="color:var(--muted);font-size:13px">-</span>';
  document.getElementById('rwTags').innerHTML = '';

  // 타당도
  // validity_caveats warn-box 숨김
}

// ── 강의 이력 렌더링 ──────────────────────────────────────────
let _lecturePage = 0;

function changeLecturePage(dir){
  const pageSize = parseInt(document.getElementById('lecturePageSize').value);
  if(pageSize === 0) return;
  const totalPages = Math.ceil(_lectures.length / pageSize);
  _lecturePage = Math.max(0, Math.min(_lecturePage + dir, totalPages - 1));
  renderLectures();
}

function renderLectures(){
  const el = document.getElementById('lectureList');
  if(!el) return;
  if(!_lectures.length){
    el.innerHTML='<div style="color:var(--muted);font-size:13px;padding:12px">강의 이력이 없습니다.</div>';
    return;
  }

  const pageSize   = parseInt(document.getElementById('lecturePageSize')?.value || '10');
  const totalPages = pageSize === 0 ? 1 : Math.ceil(_lectures.length / pageSize);
  _lecturePage     = Math.max(0, Math.min(_lecturePage, totalPages - 1));
  const start      = pageSize === 0 ? 0 : _lecturePage * pageSize;
  const end        = pageSize === 0 ? _lectures.length : start + pageSize;
  const paginated  = _lectures.slice(start, end);

  // 페이지 컨트롤 업데이트
  const countEl = document.getElementById('lectureCountLabel');
  const pageEl  = document.getElementById('lecturePageLabel');
  const prevBtn = document.getElementById('lecturePrevBtn');
  const nextBtn = document.getElementById('lectureNextBtn');
  if(countEl) countEl.textContent = `총 ${_lectures.length}건`;
  if(pageEl)  pageEl.textContent  = pageSize === 0 ? '' : `${_lecturePage+1} / ${totalPages}`;
  if(prevBtn) prevBtn.style.opacity = (_lecturePage === 0 || pageSize === 0) ? '0.3' : '1';
  if(nextBtn) nextBtn.style.opacity = (_lecturePage >= totalPages-1 || pageSize === 0) ? '0.3' : '1';

  const CATE_NUM_MAP = {
    cate1:{'1':'1.1','2':'1.2','3':'1.3'},
    cate2:{'1':'2.1','2':'2.2','3':'2.3','4':'2.4','5':'2.5'},
    cate3:{'1':'3.1','2':'3.2','3':'3.3','4':'3.4'},
    cate4:{'1':'4.1','2':'4.2','3':'4.3'},
    cate5:{'1':'5.1','2':'5.2','3':'5.3'},
  };

  function catAvg(cats, cateKey){
    const cat = cats[cateKey]; if(!cat) return null;
    const numMap = CATE_NUM_MAP[cateKey]||{};
    const src = cat.items||cat||{};
    const vals=[];
    for(const[id,v] of Object.entries(src)){
      if(typeof v!=='object'||!v||v.error) continue;
      const s=parseFloat(v.score??v['점수']??null);
      if(!isNaN(s)) vals.push(s);
    }
    return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
  }

  el.innerHTML = paginated.map(doc=>{
    const key = encodeURIComponent(doc.resultFile);
    const ts  = new Date(doc.timestamp).toLocaleString('ko-KR');
    const badges = ['cate1','cate2','cate3','cate4','cate5'].map((k,i)=>{
      const s = catAvg(doc.categories||{}, k);
      if(s===null) return '';
      const pct = Math.round(s*20);
      const col = scoreColor(pct);
      const lbl = CATE_META[String(i+1)]?.label||k;
      return `<span class="score-badge" style="background:${hexAlpha(col,.12)};color:${col};border:1px solid ${hexAlpha(col,.3)}">${lbl} ${pct}</span>`;
    }).join('');

    return `<div class="history-item">
      <div style="display:flex;align-items:center;gap:12px;flex:1;min-width:0;flex-wrap:wrap">
        <div class="date-badge">${doc.date}</div>
        <div>
          <div style="font-size:13px;font-weight:600">${doc.course_id}</div>
          <div style="font-size:11px;color:var(--muted)">${ts}</div>
        </div>
        <div style="display:flex;gap:4px;flex-wrap:wrap">${badges}</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <a class="btn-detail" href="/analysis?result=${key}&instructor=${encodeURIComponent(instrName)}">상세 보기 →</a>
        <button onclick="deleteLecture('${doc.date}','${doc.course_id}')"
          style="background:rgba(248,81,73,.08);border:1px solid rgba(248,81,73,.25);border-radius:8px;padding:6px 13px;color:#f85149;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap"
          onmouseover="this.style.background='rgba(248,81,73,.2)'" onmouseout="this.style.background='rgba(248,81,73,.08)'">🗑 삭제</button>
      </div>
    </div>`;
  }).join('');
}

// ── 강의 삭제 ────────────────────────────────────────────────
async function deleteLecture(date, course_id){
  if(!confirm(`[${date}] ${course_id} 강의를 삭제하시겠습니까?`)) return;
  try{
    const key = encodeURIComponent(`${date}|${course_id}`);
    const res = await fetch(`/api/result/${key}`, { method:'DELETE' });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error||'삭제 실패');
    // 목록에서 제거 후 재렌더
    _lectures = _lectures.filter(d => !(d.date===date && d.course_id===course_id));
    _lecturePage = 0;
    renderLectures();
    // 강의가 없어지면 강사 페이지에서 나가기
    if(_lectures.length === 0){
      alert('모든 강의가 삭제되었습니다. 강사 목록으로 이동합니다.');
      location.href = '/instructors';
    }
  } catch(err){
    alert('삭제 실패: ' + err.message);
  }
}

// ── PDF 내보내기 ─────────────────────────────────────────────
function setChartForPrint(isPrint){
  if(!radarChart) return;
  const r = radarChart.options.scales.r;
  if(isPrint){
    r.pointLabels.color = '#111';
    r.pointLabels.font  = { size: 11, weight: 'bold' };
    r.grid.color        = 'rgba(0,0,0,0.15)';
    r.angleLines.color  = 'rgba(0,0,0,0.15)';
    radarChart.options.plugins.legend.display = false;
  } else {
    r.pointLabels.color = '#e6edf3';
    r.pointLabels.font  = { size: 10 };
    r.grid.color        = 'rgba(255,255,255,.07)';
    r.angleLines.color  = 'rgba(255,255,255,.07)';
  }
  radarChart.update('none'); // 애니메이션 없이 즉시 렌더
}

function exportPDF(){
  setChartForPrint(true);
  // 차트 렌더 완료 후 인쇄 (requestAnimationFrame 2프레임 대기)
  requestAnimationFrame(()=> requestAnimationFrame(()=> {
    window.print();
  }));
}

window.addEventListener('afterprint', ()=> setChartForPrint(false));

// ── DOCX용 레이더 차트: 별도 Chart 인스턴스로 캡처 (원본 건드리지 않음) ──
async function captureRadarForDocx(){
  if(!radarChart) return '';

  // 1) 오프스크린 canvas에 별도 Chart 인스턴스 생성
  const srcCanvas = document.getElementById('radarChart');
  const off = document.createElement('canvas');
  off.width  = srcCanvas.width;
  off.height = srcCanvas.height;

  // 원본 데이터 복사
  const data = radarChart.data;
  const origR = radarChart.options.scales.r;

  const printChart = new Chart(off, {
    type: 'radar',
    data: {
      labels: data.labels.slice(),
      datasets: data.datasets.map(ds => Object.assign({}, ds))
    },
    options: {
      animation: false,
      responsive: false,
      plugins: { legend: { display: false } },
      scales: {
        r: {
          min: 0, max: 100,
          ticks: { display: false },
          grid:        { color: 'rgba(0,0,0,0.15)' },
          angleLines:  { color: 'rgba(0,0,0,0.15)' },
          pointLabels: { color: '#111111', font: { size: 13, weight: 'bold' } }
        }
      }
    }
  });

  // 2) 렌더 완료 대기
  await new Promise(res => requestAnimationFrame(()=> requestAnimationFrame(res)));

  // 3) 흰 배경 합성 후 캡처
  const out = document.createElement('canvas');
  out.width = off.width; out.height = off.height;
  const ctx = out.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, out.width, out.height);
  ctx.drawImage(off, 0, 0);
  const b64 = out.toDataURL('image/png').split(',')[1];

  // 4) 임시 차트 제거 (원본 화면 영향 없음)
  printChart.destroy();

  return b64;
}

// ── DOCX 내보내기 ────────────────────────────────────────────
async function exportDOCX(){
  const btn = document.getElementById('docxBtn');
  if(btn){ btn.disabled=true; btn.textContent='⏳ 생성 중...'; }
  try{
    const radarImg = await captureRadarForDocx();
    const heroSub  = document.getElementById('heroSub')?.textContent||'';
    const gradeTxt = document.getElementById('gradeDisplay')?.textContent||'';

    const statsCards = [...document.querySelectorAll('#statsRow .stat-card')].map(c=>({
      label: c.querySelector('.stat-lbl')?.textContent||'',
      value: c.querySelector('.stat-val')?.textContent||'',
    }));

    const catBars = [...document.querySelectorAll('#catBars .cat-bar')].map(r=>({
      name:  r.querySelector('.cat-name')?.textContent||'',
      score: r.querySelector('.cat-score')?.textContent||'',
    }));

    const lectures = [...document.querySelectorAll('.history-item')].map(item=>({
      date:      item.querySelector('.date-badge')?.textContent||'',
      course_id: item.querySelector('div > div > .history-course, div[style*="font-weight:600"]')?.textContent||'',
      scores:    [...item.querySelectorAll('.score-badge')].map(b=>b.textContent.trim()).join(' '),
    }));

    const payload = {
      mode: 'instructor', instructor: instrName,
      subtitle: heroSub + '  ' + gradeTxt,
      radar_img: radarImg, stats_cards: statsCards, cat_bars: catBars,
      profile_summary:   document.getElementById('profileSummary')?.textContent||'',
      trajectory_note:   document.getElementById('trajectoryNote')?.textContent||'',
      consistency_note:  document.getElementById('consistencyNote')?.textContent||'',
      systematic_strengths:  [...document.querySelectorAll('#strengthsList .bullet')].map(b=>b.textContent.trim()),
      systematic_weaknesses: [...document.querySelectorAll('#weaknessesList .bullet')].map(b=>b.textContent.trim()),
      development_goals:     [...document.querySelectorAll('#goalsList .bullet')].map(b=>b.textContent.trim()),
      lectures,
      filename: instrName + '_종합평가.docx',
    };

    const res = await fetch('/api/export/docx', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    if(!res.ok) throw new Error(await res.text());
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = payload.filename;
    a.click();
  }catch(e){
    alert('DOCX 생성 실패: '+e.message);
  }finally{
    if(btn){ btn.disabled=false; btn.textContent='📝 DOCX'; }
  }
}

if(!instrName){ location.href='/instructors'; }
else{
  loadBasicInfo();
  loadLectures();
  // 캐시된 종합평가 자동 로드 시도
  fetch(`/api/instructor/${encodeURIComponent(instrName)}/summary`)
    .then(r=>r.json())
    .then(d=>{
      if(d && !d.error && d.instructor && d.stats){
        document.getElementById('summarySection').style.display='block';
        document.getElementById('summaryPlaceholder').style.display='none';
        requestAnimationFrame(()=>renderSummary(d));
      }
    })
    .catch(()=>{});
}
