<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강사 비교 대시보드</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#0d1117;--surf:#161b22;--surf2:#21262d;--border:rgba(255,255,255,0.08);--accent:#58a6ff;--green:#3fb950;--yellow:#d29922;--red:#f85149;--text:#e6edf3;--muted:rgba(230,237,243,0.5)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR','Malgun Gothic',sans-serif;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:56px;background:var(--surf);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200}
.brand{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700}
.brand-icon{width:34px;height:34px;background:linear-gradient(135deg,#58a6ff,#3fb950);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px}
.back{color:var(--muted);font-size:13px;text-decoration:none;transition:color .2s}
.back:hover{color:var(--accent)}
main{padding:28px;max-width:1300px;margin:0 auto}
.tab-row{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--border);margin-bottom:20px}
.tab-btn{background:transparent;border:none;border-bottom:2px solid transparent;padding:10px 18px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);transition:all .2s;margin-bottom:-1px}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.sec{display:none}.sec.active{display:block}
.itag{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1.5px solid transparent;background:transparent;transition:all .2s}
.mbtn{background:var(--surf2);border:0.5px solid var(--border);border-radius:6px;padding:4px 12px;font-size:12px;cursor:pointer;color:var(--muted);transition:all .2s}
.mbtn.active{background:rgba(88,166,255,.15);color:var(--accent);border-color:rgba(88,166,255,.4)}
.mcard{background:var(--surf2);border-radius:10px;padding:10px 14px;text-align:center}
.scard{background:var(--surf);border:0.5px solid var(--border);border-radius:14px;padding:18px 22px}
.chart-wrap{background:var(--surf);border:0.5px solid var(--border);border-radius:14px;padding:20px;margin-bottom:18px}
.loading{text-align:center;padding:60px;color:var(--muted);font-size:14px}
select{background:var(--surf2);border:0.5px solid var(--border);border-radius:6px;padding:6px 10px;color:var(--text);font-size:13px;outline:none}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="brand-icon">📊</div>강사 비교 대시보드</div>
  <a href="/dashboard" class="back">← 대시보드</a>
</header>
<main>
  <div id="loading" class="loading">⏳ MongoDB에서 데이터 로딩 중...</div>
  <div id="app" style="display:none">
    <div style="display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap" id="itags"></div>
    <div class="tab-row" id="tabs">
      <button class="tab-btn active" onclick="sw('radar')">📡 카테고리 비교</button>
      <button class="tab-btn" onclick="sw('trend')">📈 날짜별 추이</button>
      <button class="tab-btn" onclick="sw('gap')">⚖️ 강사 갭 분석</button>
      <button class="tab-btn" onclick="sw('growth')">🚀 성장률</button>
      <button class="tab-btn" onclick="sw('summary')">📋 강사별 총평</button>
    </div>

    <!-- 레이더 -->
    <div id="s-radar" class="sec active">
      <div id="lg-radar" style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px;font-size:12px;color:var(--muted)"></div>
      <div class="chart-wrap"><canvas id="cRadar" height="320"></canvas></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px" id="radar-avg"></div>
    </div>

    <!-- 추이 -->
    <div id="s-trend" class="sec">
      <div id="metric-sel" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px"></div>
      <div id="lg-trend" style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px;font-size:12px;color:var(--muted)"></div>
      <div class="chart-wrap"><canvas id="cTrend" height="260"></canvas></div>
    </div>

    <!-- 갭 -->
    <div id="s-gap" class="sec">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:14px;font-size:13px;color:var(--muted)">
        <span>비교:</span>
        <select id="gapA"></select>
        <span>vs</span>
        <select id="gapB"></select>
      </div>
      <div id="lg-gap" style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px;font-size:12px;color:var(--muted)"></div>
      <div class="chart-wrap"><canvas id="cGap" height="240"></canvas></div>
    </div>

    <!-- 성장률 -->
    <div id="s-growth" class="sec">
      <p style="font-size:12px;color:var(--muted);margin-bottom:14px">첫 회차 대비 마지막 회차 성장률 (%)</p>
      <div id="lg-growth" style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px;font-size:12px;color:var(--muted)"></div>
      <div class="chart-wrap"><canvas id="cGrowth" height="260"></canvas></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px" id="growth-cards"></div>
    </div>

    <!-- 총평 -->
    <div id="s-summary" class="sec">
      <div id="sum-body" style="display:flex;flex-direction:column;gap:14px"></div>
    </div>
  </div>
</main>

<script>
const CATE_KEYS  = ['cate1','cate2','cate3','cate4','cate5'];
const CATE_NAMES = ['언어 표현 품질','강의 도입 및 구조','개념 설명 명확성','예시 및 실습 연계','수강생 상호작용'];
const COLORS = ['#5B7FFF','#FF7A5C','#2DC88A','#FFC542','#BC8CFF','#FF5CA8','#5CD8E5'];
const ITEM_TO_CATE = {
  '1.1':'cate1','1.2':'cate1','1.3':'cate1',
  '2.1':'cate2','2.2':'cate2','2.3':'cate2','2.4':'cate2','2.5':'cate2',
  '3.1':'cate3','3.2':'cate3','3.3':'cate3','3.4':'cate3',
  '4.1':'cate4','4.2':'cate4','4.3':'cate4',
  '5.1':'cate5','5.2':'cate5','5.3':'cate5',
};
const CATE_NUM_MAP = {
  cate1:{'1':'1.1','2':'1.2','3':'1.3'},
  cate2:{'1':'2.1','2':'2.2','3':'2.3','4':'2.4','5':'2.5'},
  cate3:{'1':'3.1','2':'3.2','3':'3.3','4':'3.4'},
  cate4:{'1':'4.1','2':'4.2','3':'4.3'},
  cate5:{'1':'5.1','2':'5.2','3':'5.3'},
};

// ── 데이터 로드 ──────────────────────────────────────────────
let INS=[], active=new Set(), selCat=CATE_NAMES[0], gapA='', gapB='';
let charts={};

async function loadData(){
  const res  = await fetch('/api/results?limit=2000');
  const docs = await res.json();

  // 강사별 그룹핑
  const byInstructor = {};
  docs.forEach(doc=>{
    const name = doc.instructor || doc.course_id || '미확인';
    if(!byInstructor[name]) byInstructor[name]=[];
    byInstructor[name].push(doc);
  });

  INS = Object.entries(byInstructor).map(([name, records], idx)=>({
    id:    name,
    name,
    color: COLORS[idx % COLORS.length],
    alpha: hexAlpha(COLORS[idx % COLORS.length], 0.15),
    records: records.sort((a,b)=>new Date(a.date||a.timestamp)-new Date(b.date||b.timestamp)),
  }));

  if(INS.length < 2){
    document.getElementById('loading').textContent = '⚠️ 비교하려면 강사가 2명 이상 필요합니다. (현재 '+INS.length+'명)';
    return;
  }

  active = new Set(INS.map(i=>i.id));
  gapA = INS[0].id;
  gapB = INS[1].id;

  document.getElementById('loading').style.display='none';
  document.getElementById('app').style.display='block';

  buildTags(); buildRadar(); buildMetricSel(); buildTrend();
  buildGapSelects(); buildGap(); buildGrowth(); buildSum();
}

// 카테고리 평균 점수 추출
function extractCateScores(doc){
  const cats = doc.categories || {};
  const scores = {};
  CATE_KEYS.forEach(ck=>{ scores[ck]=null; });

  for(const[ck, cv] of Object.entries(cats)){
    if(!CATE_KEYS.includes(ck)) continue;
    const numMap = CATE_NUM_MAP[ck]||{};
    const src = cv.items || cv || {};
    const vals = [];
    for(const[itemId, itemVal] of Object.entries(src)){
      if(typeof itemVal!=='object'||!itemVal||itemVal.error) continue;
      const realId = numMap[itemId]||itemId;
      const s = parseFloat(itemVal.score ?? itemVal['점수'] ?? null);
      if(!isNaN(s)) vals.push(s);
    }
    if(vals.length) scores[ck] = vals.reduce((a,b)=>a+b,0)/vals.length;
  }
  return scores;
}

// 강사별 카테고리 평균 (전 회차 평균)
function instrAvgScores(ins){
  const sums = {}; const cnts = {};
  CATE_KEYS.forEach(k=>{ sums[k]=0; cnts[k]=0; });
  ins.records.forEach(doc=>{
    const sc = extractCateScores(doc);
    CATE_KEYS.forEach(k=>{ if(sc[k]!==null){ sums[k]+=sc[k]; cnts[k]++; } });
  });
  return CATE_KEYS.map(k=>cnts[k]>0?Math.round(sums[k]/cnts[k]*20):0); // 0~100 환산
}

// 날짜별 특정 카테고리 점수
function instrTrend(ins, cateKey){
  return ins.records.map(doc=>{
    const sc = extractCateScores(doc);
    return sc[cateKey]!==null ? Math.round(sc[cateKey]*20) : null;
  });
}

function dates(ins){ return ins.records.map(d=>d.date||(new Date(d.timestamp).toLocaleDateString('ko-KR',{month:'2-digit',day:'2-digit'}))); }

function hexAlpha(hex,a){ const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16); return `rgba(${r},${g},${b},${a})`; }

const ga = ()=>INS.filter(i=>active.has(i.id));

// ── 태그 ─────────────────────────────────────────────────────
function buildTags(){
  const c=document.getElementById('itags'); c.innerHTML='';
  INS.forEach(i=>{
    const on=active.has(i.id);
    const b=document.createElement('button'); b.className='itag';
    b.style.cssText=`border-color:${on?i.color:'var(--border)'};background:${on?i.alpha:'transparent'};color:${on?i.color:'var(--muted)'};`;
    b.innerHTML=`<span style="width:8px;height:8px;border-radius:50%;background:${i.color};display:inline-block"></span>${i.name} 강사 (${i.records.length}회)`;
    b.onclick=()=>{
      if(active.has(i.id)&&active.size>1) active.delete(i.id);
      else active.add(i.id);
      buildTags(); rebuildAll();
    };
    c.appendChild(b);
  });
}

function rebuildAll(){ updRadar(); updTrend(); updGap(); updGrowth(); buildSum(); }

function legend(id){
  const el=document.getElementById(id); if(!el)return; el.innerHTML='';
  ga().forEach(i=>{
    const s=document.createElement('span');
    s.style.cssText='display:inline-flex;align-items:center;gap:5px;';
    s.innerHTML=`<span style="width:10px;height:10px;border-radius:2px;background:${i.color}"></span>${i.name} 강사`;
    el.appendChild(s);
  });
}

// ── 레이더 ───────────────────────────────────────────────────
function buildRadar(){
  const ctx=document.getElementById('cRadar').getContext('2d');
  charts.radar=new Chart(ctx,{
    type:'radar',
    data:{labels:CATE_NAMES,datasets:radarDatasets()},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{r:{min:0,max:100,ticks:{display:false},
        grid:{color:'rgba(255,255,255,.07)'},angleLines:{color:'rgba(255,255,255,.07)'},
        pointLabels:{font:{size:11},color:var_text()}}}}
  });
  legend('lg-radar'); buildRadarAvg();
}
function radarDatasets(){
  return ga().map(i=>({label:i.name,data:instrAvgScores(i),borderColor:i.color,backgroundColor:i.alpha,borderWidth:2,pointBackgroundColor:i.color,pointRadius:4,pointBorderColor:'#fff',pointBorderWidth:1.5}));
}
function updRadar(){ charts.radar.data.datasets=radarDatasets(); charts.radar.update(); legend('lg-radar'); buildRadarAvg(); }
function buildRadarAvg(){
  const el=document.getElementById('radar-avg'); el.innerHTML='';
  ga().forEach(i=>{
    const sc=instrAvgScores(i); const avg=Math.round(sc.reduce((a,b)=>a+b,0)/sc.length);
    const d=document.createElement('div'); d.className='mcard';
    d.style.cssText=`border-left:3px solid ${i.color};border-radius:0 10px 10px 0;`;
    d.innerHTML=`<p style="margin:0 0 2px;font-size:11px;color:var(--muted)">${i.name}</p><p style="margin:0;font-size:22px;font-weight:500;color:${i.color}">${avg}</p><p style="margin:0;font-size:10px;color:var(--muted)">평균 (100점)</p>`;
    el.appendChild(d);
  });
}

// ── 추이 ─────────────────────────────────────────────────────
function buildMetricSel(){
  const c=document.getElementById('metric-sel'); c.innerHTML='';
  CATE_NAMES.forEach((m,idx)=>{
    const b=document.createElement('button'); b.className='mbtn'+(m===selCat?' active':'');
    b.textContent=m; b.onclick=()=>{ selCat=m; buildMetricSel(); updTrend(); };
    c.appendChild(b);
  });
}
function trendDatasets(){
  const cateKey = CATE_KEYS[CATE_NAMES.indexOf(selCat)];
  // 가장 많은 날짜 수를 가진 강사 기준으로 레이블
  const maxIns = ga().reduce((a,b)=>a.records.length>b.records.length?a:b);
  charts._trendDates = dates(maxIns);
  return ga().map(i=>({label:i.name,data:instrTrend(i,cateKey),borderColor:i.color,backgroundColor:i.alpha,borderWidth:2,pointBackgroundColor:i.color,pointRadius:4,pointBorderColor:'#fff',pointBorderWidth:1.5,tension:0.35,fill:false,spanGaps:true}));
}
function buildTrend(){
  const ctx=document.getElementById('cTrend').getContext('2d');
  const ds=trendDatasets();
  charts.trend=new Chart(ctx,{
    type:'line',
    data:{labels:charts._trendDates,datasets:ds},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{y:{min:0,max:100,ticks:{stepSize:20,font:{size:10},color:'#666',callback:v=>v+'점'},grid:{color:'rgba(255,255,255,.06)'}},
        x:{ticks:{font:{size:10},color:'#666'},grid:{display:false}}}}
  });
  legend('lg-trend');
}
function updTrend(){ const ds=trendDatasets(); charts.trend.data.labels=charts._trendDates; charts.trend.data.datasets=ds; charts.trend.update(); legend('lg-trend'); }

// ── 갭 ───────────────────────────────────────────────────────
function buildGapSelects(){
  ['gapA','gapB'].forEach((id,idx)=>{
    const sel=document.getElementById(id); sel.innerHTML='';
    INS.forEach(i=>{
      const o=document.createElement('option'); o.value=i.id; o.textContent=i.name+' 강사';
      if((idx===0&&i.id===gapA)||(idx===1&&i.id===gapB)) o.selected=true;
      sel.appendChild(o);
    });
    sel.onchange=()=>{ if(id==='gapA')gapA=sel.value; else gapB=sel.value; updGap(); };
  });
}
function gapDatasets(){
  const iA=INS.find(i=>i.id===gapA), iB=INS.find(i=>i.id===gapB);
  if(!iA||!iB) return [];
  return [
    {label:iA.name,data:instrAvgScores(iA),backgroundColor:iA.color+'cc',borderColor:iA.color,borderWidth:1,borderRadius:4},
    {label:iB.name,data:instrAvgScores(iB),backgroundColor:iB.color+'cc',borderColor:iB.color,borderWidth:1,borderRadius:4},
  ];
}
function buildGap(){
  const ctx=document.getElementById('cGap').getContext('2d');
  charts.gap=new Chart(ctx,{
    type:'bar',
    data:{labels:CATE_NAMES,datasets:gapDatasets()},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{y:{min:0,max:100,ticks:{stepSize:20,font:{size:10},color:'#666'},grid:{color:'rgba(255,255,255,.06)'}},
        x:{ticks:{font:{size:10},color:'#666',maxRotation:15},grid:{display:false}}}}
  });
  updGapLegend();
}
function updGap(){ charts.gap.data.datasets=gapDatasets(); charts.gap.update(); updGapLegend(); }
function updGapLegend(){
  const el=document.getElementById('lg-gap'); el.innerHTML='';
  [gapA,gapB].forEach(id=>{
    const i=INS.find(x=>x.id===id); if(!i)return;
    const s=document.createElement('span');
    s.style.cssText='display:inline-flex;align-items:center;gap:5px;';
    s.innerHTML=`<span style="width:10px;height:10px;border-radius:2px;background:${i.color}"></span>${i.name} 강사`;
    el.appendChild(s);
  });
}

// ── 성장률 ───────────────────────────────────────────────────
function growthRate(ins, cateIdx){
  if(ins.records.length<2) return 0;
  const sc = instrTrend(ins, CATE_KEYS[cateIdx]).filter(v=>v!==null);
  if(sc.length<2) return 0;
  return Math.round(((sc[sc.length-1]-sc[0])/(sc[0]||1))*100*10)/10;
}
function buildGrowth(){
  const ctx=document.getElementById('cGrowth').getContext('2d');
  charts.growth=new Chart(ctx,{
    type:'bar',
    data:{labels:CATE_NAMES,datasets:ga().map(i=>({label:i.name,data:CATE_NAMES.map((_,idx)=>growthRate(i,idx)),backgroundColor:i.color+'cc',borderColor:i.color,borderWidth:1,borderRadius:4}))},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{y:{ticks:{font:{size:10},color:'#666',callback:v=>v+'%'},grid:{color:'rgba(255,255,255,.06)'}},
        x:{ticks:{font:{size:10},color:'#666',maxRotation:15},grid:{display:false}}}}
  });
  legend('lg-growth'); buildGrowthCards();
}
function updGrowth(){
  charts.growth.data.datasets=ga().map(i=>({label:i.name,data:CATE_NAMES.map((_,idx)=>growthRate(i,idx)),backgroundColor:i.color+'cc',borderColor:i.color,borderWidth:1,borderRadius:4}));
  charts.growth.update(); legend('lg-growth'); buildGrowthCards();
}
function buildGrowthCards(){
  const el=document.getElementById('growth-cards'); el.innerHTML='';
  ga().forEach(i=>{
    const avg=(CATE_NAMES.reduce((s,_,idx)=>s+growthRate(i,idx),0)/CATE_NAMES.length).toFixed(1);
    const d=document.createElement('div'); d.className='mcard';
    d.style.cssText=`border-left:3px solid ${i.color};border-radius:0 10px 10px 0;`;
    d.innerHTML=`<p style="margin:0 0 2px;font-size:11px;color:var(--muted)">${i.name}</p><p style="margin:0;font-size:20px;font-weight:500;color:${i.color}">${avg>=0?'+':''}${avg}%</p><p style="margin:0;font-size:10px;color:var(--muted)">평균 성장률</p>`;
    el.appendChild(d);
  });
}

// ── 총평 ─────────────────────────────────────────────────────
function buildSum(){
  const el=document.getElementById('sum-body'); el.innerHTML='';
  ga().forEach(i=>{
    const sc=instrAvgScores(i);
    const overall=Math.round(sc.reduce((a,b)=>a+b,0)/sc.length);
    const best=CATE_NAMES[sc.indexOf(Math.max(...sc))];
    const worst=CATE_NAMES[sc.indexOf(Math.min(...sc))];
    const rows=CATE_NAMES.map((c,idx)=>{
      const pct=sc[idx];
      return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
        <span style="font-size:11px;color:var(--muted);min-width:110px">${c}</span>
        <div style="flex:1;height:5px;background:var(--surf2);border-radius:3px;overflow:hidden"><div style="width:${pct}%;height:100%;background:${i.color};border-radius:3px"></div></div>
        <span style="font-size:11px;font-weight:500;color:${i.color};min-width:30px;text-align:right">${pct}점</span>
      </div>`;
    }).join('');
    const card=document.createElement('div'); card.className='scard';
    card.innerHTML=`
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
        <div style="width:40px;height:40px;border-radius:50%;background:${i.alpha};display:flex;align-items:center;justify-content:center;border:2px solid ${i.color}">
          <span style="font-size:15px;font-weight:700;color:${i.color}">${i.name[0]}</span>
        </div>
        <div style="flex:1">
          <p style="margin:0;font-size:14px;font-weight:700">${i.name} 강사</p>
          <p style="margin:0;font-size:12px;color:var(--muted)">${i.records.length}회 강의 분석</p>
        </div>
        <span style="padding:4px 14px;border-radius:20px;font-size:13px;font-weight:700;background:${i.alpha};color:${i.color};border:1px solid ${i.color}">${overall}점</span>
      </div>
      <div style="margin-bottom:14px">${rows}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div style="background:rgba(63,185,80,.08);border-radius:8px;padding:10px 12px">
          <p style="margin:0 0 3px;font-size:10px;color:#3fb950;font-weight:600">최고 영역</p>
          <p style="margin:0;font-size:12px">${best}</p>
        </div>
        <div style="background:rgba(248,81,73,.08);border-radius:8px;padding:10px 12px">
          <p style="margin:0 0 3px;font-size:10px;color:#f85149;font-weight:600">개선 필요</p>
          <p style="margin:0;font-size:12px">${worst}</p>
        </div>
      </div>`;
    el.appendChild(card);
  });
}

// ── 탭 전환 ──────────────────────────────────────────────────
const TABIDS=['radar','trend','gap','growth','summary'];
function sw(tab){
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',TABIDS[i]===tab));
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));
  document.getElementById('s-'+tab).classList.add('active');
}

function var_text(){ return getComputedStyle(document.documentElement).getPropertyValue('--text').trim()||'#e6edf3'; }

loadData().catch(e=>{
  document.getElementById('loading').textContent='❌ 데이터 로드 실패: '+e.message;
});
</script>
