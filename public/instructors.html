<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강사 대시보드 — AI 강의분석</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1117;--surf:#161b22;--surf2:#21262d;--border:rgba(255,255,255,0.08);--accent:#58a6ff;--green:#3fb950;--yellow:#d29922;--red:#f85149;--text:#e6edf3;--muted:rgba(230,237,243,0.5)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR','Malgun Gothic',sans-serif;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:56px;background:var(--surf);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200}
.brand{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700}
.brand-icon{width:34px;height:34px;background:linear-gradient(135deg,#58a6ff,#3fb950);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px}
.nav-links{display:flex;align-items:center;gap:12px}
.nav-btn{background:rgba(88,166,255,.1);border:1px solid rgba(88,166,255,.3);border-radius:8px;padding:6px 14px;color:#58a6ff;font-size:13px;font-weight:600;text-decoration:none;transition:all .2s}
.nav-btn:hover{background:rgba(88,166,255,.2)}
.logout{color:var(--muted);font-size:13px;text-decoration:none}
.logout:hover{color:var(--text)}
main{padding:32px 28px;max-width:1200px;margin:0 auto}
.page-title{font-size:22px;font-weight:700;margin-bottom:6px}
.page-sub{font-size:13px;color:var(--muted);margin-bottom:28px}
.filter-row{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.filter-input{background:var(--surf2);border:0.5px solid var(--border);border-radius:8px;padding:8px 14px;color:var(--text);font-size:13px;outline:none;width:200px;transition:border .2s}
.filter-input:focus{border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--surf);border:0.5px solid var(--border);border-radius:14px;padding:20px;cursor:pointer;transition:all .2s;text-decoration:none;display:block}
.card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.3)}
.card-top{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.avatar{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0}
.card-name{font-size:16px;font-weight:700;margin-bottom:2px}
.card-sub{font-size:12px;color:var(--muted)}
.divider{height:0.5px;background:var(--border);margin:12px 0}
.meta-row{display:flex;gap:16px;flex-wrap:wrap}
.meta-item{display:flex;flex-direction:column;gap:2px}
.meta-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.meta-value{font-size:13px;font-weight:600}
.courses{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}
.course-tag{background:var(--surf2);border:0.5px solid var(--border);border-radius:6px;padding:3px 8px;font-size:11px;color:var(--muted)}
.empty{text-align:center;padding:60px;color:var(--muted);font-size:14px}
.loading{text-align:center;padding:60px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="brand-icon">🎓</div>AI 강의분석 리포트</div>
  <div class="nav-links">
    <a href="/upload" class="nav-btn" style="background:rgba(63,185,80,.1);border-color:rgba(63,185,80,.3);color:#3fb950">📤 강의 분석</a>
    <a href="/comparison.html" class="nav-btn">📊 강사 비교</a>
    <a href="/logout" class="logout">로그아웃 →</a>
  </div>
</header>
<main>
  <div class="page-title">강사 대시보드</div>
  <div class="page-sub">강사를 선택하면 종합 평가 및 강의 이력을 확인할 수 있습니다.</div>

  <div class="filter-row">
    <input class="filter-input" id="filterName" type="text" placeholder="🔍 강사명 검색" oninput="filterCards()">
    <span id="totalCount" style="font-size:12px;color:var(--muted)"></span>
  </div>

  <div class="grid" id="grid">
    <div class="loading">⏳ 강사 데이터 로딩 중...</div>
  </div>
</main>

<script>
const COLORS = ['#5B7FFF','#FF7A5C','#2DC88A','#FFC542','#BC8CFF','#FF5CA8','#5CD8E5','#FF9F43'];
let _all = [];

async function load(){
  try{
    const res  = await fetch('/api/instructors');
    const data = await res.json();
    _all = data.sort((a,b)=>b.lecture_count - a.lecture_count);
    render(_all);
  }catch(e){
    document.getElementById('grid').innerHTML = `<div class="empty">❌ 데이터 로드 실패: ${e.message}</div>`;
  }
}

function render(list){
  const grid = document.getElementById('grid');
  document.getElementById('totalCount').textContent = `총 ${list.length}명`;

  if(!list.length){
    grid.innerHTML = '<div class="empty">검색 결과가 없습니다</div>';
    return;
  }

  grid.innerHTML = list.map((ins, idx)=>{
    const color  = COLORS[idx % COLORS.length];
    const alpha  = hexAlpha(color, 0.15);
    const border = hexAlpha(color, 0.3);
    const initial = ins.instructor !== '미확인' ? ins.instructor[0] : '?';
    const uniqueCourses = [...new Set(ins.courses||[])];
    const courses = uniqueCourses.slice(0,4).map(c=>
      `<span class="course-tag">${c}</span>`
    ).join('') + (uniqueCourses.length > 4 ? `<span class="course-tag">+${uniqueCourses.length-4}</span>` : '');

    return `<a class="card" href="/instructor?name=${encodeURIComponent(ins.instructor)}">
      <div class="card-top">
        <div class="avatar" style="background:${alpha};border:2px solid ${border};color:${color}">${initial}</div>
        <div>
          <div class="card-name">${ins.instructor} 강사</div>
          <div class="card-sub">마지막 강의: ${ins.last_date||'-'}</div>
        </div>
      </div>
      <div class="divider"></div>
      <div class="meta-row">
        <div class="meta-item">
          <span class="meta-label">강의 수</span>
          <span class="meta-value" style="color:${color}">${ins.lecture_count}회</span>
        </div>
        <div class="meta-item">
          <span class="meta-label">과목 수</span>
          <span class="meta-value">${uniqueCourses.length}개</span>
        </div>
      </div>
      ${courses ? `<div class="courses">${courses}</div>` : ''}
    </a>`;
  }).join('');
}

function filterCards(){
  const q = document.getElementById('filterName').value.trim().toLowerCase();
  render(q ? _all.filter(i=>(i.instructor||'').toLowerCase().includes(q)) : _all);
}

function hexAlpha(hex, a){
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

load();
</script>
</body>
</html>
